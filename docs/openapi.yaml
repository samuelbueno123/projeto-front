openapi: 3.1.0
info:
  title: Condomínio App API
  version: 1.0.0
  description: API oficial para comunicação do front-end com o back-end do projeto
    Condomínio App.
  contact:
    name: Condominio App
    email: contato@condominioapp.com
servers:
- url: http://localhost:8080
  description: Servidor Local
paths:
  /oauth2/token:
    post:
      summary: Autenticação via Email/Senha
      x-implementation-status: required
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  example: password
                username:
                  type: string
                password:
                  type: string
                scope:
                  type: string
                  example: read write
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Erro de autenticação
      operationId: post_oauth2_token
      description: Autenticação via Email/Senha
      tags:
      - oauth2
  /auth/google:
    post:
      summary: Autenticação via Google
      x-implementation-status: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Não autorizado
      operationId: post_auth_google
      description: Autenticação via Google
      tags:
      - auth
  /users:
    post:
      summary: Cadastrar usuário
      x-implementation-status: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Criado
        '400':
          description: Dados inválidos
      operationId: post_users
      description: Cadastrar usuário
      tags:
      - users
  /users/me:
    get:
      summary: Perfil do usuário atual
      x-implementation-status: required
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dados do perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                  lastName:
                    type: string
                  email:
                    type: string
                  profileImage:
                    type: string
      operationId: get_users_me
      description: Perfil do usuário atual
      tags:
      - users
  /users/me/profile:
    put:
      summary: Atualizar perfil do usuário
      x-implementation-status: required
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                profileImage:
                  type: string
                currentPassword:
                  type: string
                googleIdToken:
                  type: string
      responses:
        '200':
          description: Perfil atualizado
      operationId: put_users_me_profile
      description: Atualizar perfil do usuário
      tags:
      - users
  /users/me/password:
    post:
      summary: Alterar senha do usuário
      x-implementation-status: required
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                currentPassword:
                  type: string
                googleIdToken:
                  type: string
      responses:
        '200':
          description: Senha alterada
      operationId: post_users_me_password
      description: Alterar senha do usuário
      tags:
      - users
  /notifications/my:
    get:
      summary: Listar notificações do usuário
      x-implementation-status: required
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de notificações
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    message:
                      type: string
                    read:
                      type: boolean
      operationId: get_notifications_my
      description: Listar notificações do usuário
      tags:
      - notifications
  /notifications/{id}/read:
    patch:
      summary: Marcar notificação como lida
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Notificação lida
      operationId: patch_notifications_id_read
      description: Marcar notificação como lida
      tags:
      - notifications
  /memberships/my:
    get:
      summary: Listar participações do usuário em condomínios
      x-implementation-status: required
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de participações
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    condominiumId:
                      type: integer
                    role:
                      type: string
                    unitId:
                      type: integer
      operationId: get_memberships_my
      description: Listar participações do usuário em condomínios
      tags:
      - memberships
  /condominiums/{id}:
    get:
      summary: Obter detalhes do condomínio
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Detalhes do condomínio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Condominium'
      operationId: get_condominiums_id
      description: Obter detalhes do condomínio
      tags:
      - condominiums
  /condominiums/{id}/common-areas:
    get:
      summary: Listar áreas comuns do condomínio
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Áreas comuns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonArea'
      operationId: get_condominiums_id_common-areas
      description: Listar áreas comuns do condomínio
      tags:
      - condominiums
  /common-areas/{id}/reservations:
    post:
      summary: Reservar área comum
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Reserva criada
      operationId: post_common-areas_id_reservations
      description: Reservar área comum
      tags:
      - common-areas
  /reservations/{id}/cancel:
    patch:
      summary: Cancelar reserva
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Reserva cancelada
      operationId: patch_reservations_id_cancel
      description: Cancelar reserva
      tags:
      - reservations
  /manager/condominiums/{id}/units/{unitId}/payment-status:
    put:
      summary: Atualizar status de pagamento da unidade
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: unitId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                amount:
                  type: number
                dueDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Status atualizado
      operationId: put_manager_condominiums_id_units_unitId_payment-status
      description: Atualizar status de pagamento da unidade
      tags:
      - manager
  /admin/dashboard:
    get:
      summary: Dados do painel administrativo
      x-implementation-status: required
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dados do painel
      operationId: get_admin_dashboard
      description: Dados do painel administrativo
      tags:
      - admin
  /admin/system-announcements:
    post:
      summary: Criar aviso do sistema
      x-implementation-status: required
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
                imageUrl:
                  type:
                  - string
                  - 'null'
      responses:
        '201':
          description: Aviso criado
      operationId: post_admin_system-announcements
      description: Criar aviso do sistema
      tags:
      - admin
  /packages/{id}/{action}:
    patch:
      summary: Atualizar status do pacote
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: action
        required: true
        schema:
          type: string
          enum: [receive, cancel, notify, pickup, return]
      responses:
        '200':
          description: Pacote atualizado
      operationId: patch_packages_id_action
      description: 'Ações observadas na portaria: receber, cancelar, notificar, registrar retirada e devolver.'
      tags:
      - packages
  /packages:
    post:
      summary: Registrar pacote
      x-implementation-status: required
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageRequest'
      responses:
        '201':
          description: Pacote registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/ValidationError'
      operationId: post_packages
      description: Registrar pacote
      tags:
      - packages
    get:
      summary: Listar encomendas do condomínio
      description: Usado pela portaria para carregar encomendas do condomínio selecionado.
      operationId: get_packages
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - name: condominiumId
        in: query
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de encomendas (ou lista simples compatível).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PackagePage'
                - type: array
                  items:
                    $ref: '#/components/schemas/Package'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
      - packages
  /packages/my:
    get:
      summary: Listar encomendas do usuário atual
      operationId: get_packages_my
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Encomendas do usuário autenticado.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PackagePage'
                - type: array
                  items:
                    $ref: '#/components/schemas/Package'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - packages
  /manager/dashboard:
    get:
      summary: Consultar painel do síndico
      operationId: get_manager_dashboard
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - name: condominiumId
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Totais, pagamentos de unidades e reservas do condomínio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - manager
  /condominiums/{id}/announcements:
    get:
      summary: Listar comunicados do condomínio
      operationId: get_condominium_announcements
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Comunicados associados ao condomínio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - condominiums
  /condominiums/{id}/reservations/my:
    get:
      summary: Listar reservas do usuário no condomínio
      operationId: get_condominium_reservations_my
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reservas do usuário no condomínio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - reservations
  /memberships:
    get:
      summary: Listar vínculos
      operationId: get_memberships
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de vínculos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - memberships
  /sectors:
    get:
      summary: Listar setores
      operationId: get_sectors
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de setores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - sectors
  /units:
    get:
      summary: Listar unidades
      operationId: get_units
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de unidades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - units
  /residents:
    get:
      summary: Listar moradores
      operationId: get_residents
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de moradores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - residents
  /billing/plans:
    get:
      summary: Listar planos de cobrança
      operationId: get_billing_plans
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de planos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - billing
  /admin/data/{resource}:
    get:
      summary: Consultar registros para a área administrativa
      operationId: get_admin_resource_data
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
          enum: [users, condominiums, memberships, sectors, units, residents, packages, announcements, reservations, common-areas, notifications, billing-plans, features]
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de registros da coleção solicitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - admin
  /admin/search:
    get:
      summary: Pesquisar usuários, condomínios e setores
      operationId: get_admin_search
      x-implementation-status: required
      security:
      - bearerAuth: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grupos de resultados de pesquisa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
      - admin
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
  responses:
    ValidationError:
      description: Requisição inválida ou campos rejeitados pela validação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Token ausente, inválido ou expirado.
    Forbidden:
      description: Usuário autenticado sem autorização para a operação.
    NotFound:
      description: Recurso inexistente.
    UnexpectedError:
      description: Falha inesperada da API.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSession:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        name:
          type: string
        email:
          type: string
    ApiError:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        detail:
          type: string
        error_description:
          type: string
        errors:
          type: array
          items:
            oneOf:
            - type: string
            - type: object
              properties:
                fieldName:
                  type: string
                message:
                  type: string
              additionalProperties: true
      additionalProperties: true
    Condominium:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
    CommonArea:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
    CreatePackageRequest:
      type: object
      required: [condominiumId, description]
      properties:
        condominiumId:
          type: integer
        description:
          type: string
          minLength: 1
        recipientId:
          type: integer
        unitId:
          type: integer
    Package:
      type: object
      properties:
        id:
          type: integer
        condominiumId:
          type: integer
        recipientId:
          type: integer
        unitId:
          type: integer
        description:
          type: string
        status:
          type: string
          enum: [EXPECTED, RECEIVED, NOTIFIED, DELIVERED, RETURNED, CANCELED]
        receivedAt:
          type: string
          format: date-time
    PackagePage:
      allOf:
      - $ref: '#/components/schemas/GenericPage'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/Package'
    GenericPage:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        totalPages:
          type: integer
        totalElements:
          type: integer
        number:
          type: integer
        size:
          type: integer
    Announcement:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        message:
          type: string
        imageUrl:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
    Reservation:
      type: object
      properties:
        id:
          type: integer
        commonAreaName:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
    ManagerDashboard:
      type: object
      properties:
        totalUnits:
          type: integer
        totalUsers:
          type: integer
        totalReservations:
          type: integer
        units:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              sector:
                type: string
              identifier:
                type: string
              paymentStatus:
                type: string
              amount:
                type:
                - number
                - 'null'
              dueDate:
                type:
                - string
                - 'null'
                format: date
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
    AdminSearchResult:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            additionalProperties: true
        condominiums:
          type: array
          items:
            type: object
            additionalProperties: true
        sectors:
          type: array
          items:
            type: object
            additionalProperties: true
tags:
- name: admin
  description: Endpoints related to admin
- name: auth
  description: Endpoints related to auth
- name: common-areas
  description: Endpoints related to common-areas
- name: condominiums
  description: Endpoints related to condominiums
- name: manager
  description: Endpoints related to manager
